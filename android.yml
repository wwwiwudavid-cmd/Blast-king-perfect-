name: Build Blast King (Android APK)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Find the project files
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z"; done
          DIR=$(dirname "$(find . -name capacitor.config.json -not -path './node_modules/*' | head -n 1)")
          if [ "$DIR" != "." ]; then cp -r "$DIR"/. .; fi
          ls

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install packages
        run: npm install

      - name: Prepare web and icon folders
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/

      - name: Protect the game code
        run: |
          if [ -f no-protect.txt ]; then echo "Protection switched off (no-protect.txt found)"; exit 0; fi
          cp www/index.html www/index.unprotected.html
          if npm install --no-save javascript-obfuscator@4 && node protect.js; then echo "Game code protected"; else echo "Protection failed - using the normal game file"; cp www/index.unprotected.html www/index.html; fi
          rm -f www/index.unprotected.html

      - name: Create the Android project
        run: npx cap add android

      - name: Make app icons and splash screens
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Add the AdMob app ID
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'xmlns:tools' $M || sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' $M
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3844890569843097~2373574902" tools:replace="android:value" />\n    </application>#' $M
          S=android/app/src/main/res/values/strings.xml
          sed -i 's#</resources>#    <string name="admob_app_id">ca-app-pub-3844890569843097~2373574902</string>\n</resources>#' $S
          grep -c 'ca-app-pub-3844890569843097~2373574902' $M $S

      - name: Lock the game to portrait
        run: sed -i 's/<activity\b/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Copy the game into the app
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: blast-king-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
